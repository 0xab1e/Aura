<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aura — Interview Mentor</title>
<style>
  :root{
    --bg:#0f1117; --panel:#181b24; --bubble-me:#2b5cff; --bubble-ai:#222633;
    --text:#e8eaf0; --muted:#8a90a3; --accent:#4f7cff; --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column;height:100dvh}
  header{padding:max(env(safe-area-inset-top),10px) 16px 10px;background:var(--panel);
         display:flex;align-items:center;gap:10px;border-bottom:1px solid #262a38}
  header h1{font-size:17px;font-weight:600}
  #mode{font-size:12px;color:var(--muted);background:#262a38;padding:2px 10px;border-radius:99px}
  #due{font-size:12px;color:#ffd166;margin-left:auto}
  #chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;
        -webkit-overflow-scrolling:touch}
  .msg{max-width:88%;padding:10px 14px;border-radius:var(--radius);white-space:pre-wrap;
       word-wrap:break-word;font-size:15px}
  .me{align-self:flex-end;background:var(--bubble-me);border-bottom-right-radius:4px}
  .ai{align-self:flex-start;background:var(--bubble-ai);border-bottom-left-radius:4px}
  .sys{align-self:center;color:var(--muted);font-size:13px;text-align:center}
  .typing{align-self:flex-start;color:var(--muted);font-size:13px;padding:4px 14px}
  #chips{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;background:var(--panel);
         border-top:1px solid #262a38;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  #chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:#262a38;color:var(--text);border:none;border-radius:99px;
        padding:7px 14px;font-size:13px;cursor:pointer}
  .chip:active{background:var(--accent)}
  #composer{display:flex;gap:8px;padding:10px 12px max(env(safe-area-inset-bottom),10px);
            background:var(--panel)}
  #input{flex:1;background:#10131b;border:1px solid #2a2f40;border-radius:22px;color:var(--text);
         padding:11px 16px;font-size:16px;resize:none;max-height:120px;outline:none}
  .iconbtn{width:44px;height:44px;border-radius:50%;border:none;font-size:18px;cursor:pointer;
           background:var(--accent);color:#fff;flex:0 0 auto}
  #micBtn.listening{background:#e0245e;animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.6}}
  #speakBtn{background:#262a38}
  #speakBtn.on{background:#1f8a4c}
  /* modals */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;
         align-items:flex-end;justify-content:center;z-index:10}
  .modal.open{display:flex}
  .sheet{background:var(--panel);width:100%;max-width:680px;max-height:88dvh;overflow-y:auto;
         border-radius:20px 20px 0 0;padding:18px 16px max(env(safe-area-inset-bottom),18px)}
  .sheet h2{font-size:16px;margin-bottom:10px}
  .sheet pre{white-space:pre-wrap;background:#10131b;padding:12px;border-radius:12px;
             font-size:13px;margin:10px 0}
  .sheet textarea{width:100%;min-height:220px;background:#10131b;color:#d7e3ff;
                  border:1px solid #2a2f40;border-radius:12px;padding:12px;
                  font:13px/1.5 ui-monospace,Menlo,monospace}
  .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .btn{flex:1;min-width:90px;padding:12px;border:none;border-radius:12px;font-size:15px;
       background:var(--accent);color:#fff;cursor:pointer}
  .btn.gray{background:#262a38}
  .grade{flex:1;min-width:64px;padding:12px 6px;font-size:13px}
  .g0{background:#7a2334}.g3{background:#7a6223}.g4{background:#2d6b3f}.g5{background:#1f8a4c}
  #cardFront{font-size:17px;font-weight:600;margin:8px 0}
  #cardBack{display:none;color:#cfe3ff;background:#10131b;padding:12px;border-radius:12px;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>Aura</h1>
  <span id="mode">mentor</span>
  <span id="due"></span>
</header>

<div id="chat"></div>

<div id="chips">
  <button class="chip" onclick="cmd('debrief')">📋 Debrief</button>
  <button class="chip" onclick="openReview()">🃏 Flashcards</button>
  <button class="chip" onclick="startCode()">💻 Coding</button>
  <button class="chip" onclick="cmd('behavioral')">🗣 Behavioral</button>
  <button class="chip" onclick="cmd('mock')">🎯 Mock</button>
  <button class="chip" onclick="cmd('design')">🏗 Design</button>
  <button class="chip" onclick="cmd('end')">↩︎ End round</button>
  <button class="chip" onclick="cmd('quit')">💾 Save & end</button>
</div>

<div id="composer">
  <button class="iconbtn" id="speakBtn" title="read replies aloud" onclick="toggleSpeak()">🔊</button>
  <textarea id="input" rows="1" placeholder="Your answer…"></textarea>
  <button class="iconbtn" id="micBtn" title="hold to speak" onclick="toggleMic()">🎙</button>
  <button class="iconbtn" onclick="sendMsg()">➤</button>
</div>

<!-- coding round sheet -->
<div class="modal" id="codeModal">
  <div class="sheet">
    <h2 id="codeTitle">Coding round</h2>
    <pre id="codeStatement"></pre>
    <textarea id="codeArea" spellcheck="false"></textarea>
    <div class="row">
      <button class="btn gray" onclick="closeModal('codeModal')">Cancel</button>
      <button class="btn" onclick="submitCode()">Run & review</button>
    </div>
  </div>
</div>

<!-- flashcard review sheet -->
<div class="modal" id="reviewModal">
  <div class="sheet">
    <h2>Flashcard review <span id="cardsLeft" style="color:var(--muted);font-weight:400"></span></h2>
    <div id="cardSkill" style="color:var(--muted);font-size:12px"></div>
    <div id="cardFront"></div>
    <div id="cardBack"></div>
    <div class="row" id="showRow">
      <button class="btn" onclick="showAnswer()">Show answer</button>
      <button class="btn gray" onclick="closeModal('reviewModal')">Done</button>
    </div>
    <div class="row" id="gradeRow" style="display:none">
      <button class="btn grade g0" onclick="grade(0)">Blank</button>
      <button class="btn grade g3" onclick="grade(3)">Hard</button>
      <button class="btn grade g4" onclick="grade(4)">Good</button>
      <button class="btn grade g5" onclick="grade(5)">Easy</button>
    </div>
  </div>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
let speakOn = false, rec = null, busy = false;

function add(role, text){
  if(!text) return;
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  if(role === 'ai' && speakOn) speak(text);
}
function typing(on){
  let t = document.getElementById('t');
  if(on && !t){ t = document.createElement('div'); t.id='t'; t.className='typing';
    t.textContent='Aura is thinking…'; chat.appendChild(t); chat.scrollTop = chat.scrollHeight; }
  if(!on && t) t.remove();
}
async function api(path, body){
  busy = true; typing(true);
  try{
    const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'},
                                 body: JSON.stringify(body||{})});
    return await r.json();
  } catch(e){ return {error: 'connection lost — is the server running?'}; }
  finally{ busy = false; typing(false); }
}
function handle(res){
  if(res.error){ add('sys', '⚠ ' + res.error); return; }
  add('ai', res.reply);
  (res.extra||[]).forEach(x => add('sys', x));
  if(res.mode) document.getElementById('mode').textContent = res.mode;
}
async function sendMsg(){
  const text = input.value.trim();
  if(!text || busy) return;
  input.value = ''; autosize();
  add('me', text);
  handle(await api('/api/message', {text}));
}
async function cmd(c){
  if(busy) return;
  add('sys', '— ' + c + ' —');
  handle(await api('/api/command', {cmd:c}));
}
/* coding round */
async function startCode(){
  if(busy) return;
  add('sys','— setting up a coding round… —');
  const res = await api('/api/code/start', {});
  if(res.error){ add('sys','⚠ '+res.error); return; }
  document.getElementById('codeTitle').textContent = '💻 ' + (res.title || 'Coding round');
  document.getElementById('codeStatement').textContent = res.statement;
  document.getElementById('codeArea').value = res.stub || '';
  document.getElementById('codeModal').classList.add('open');
}
async function submitCode(){
  const code = document.getElementById('codeArea').value;
  closeModal('codeModal');
  add('sys','— running your solution… —');
  handle(await api('/api/code/submit', {code}));
}
/* flashcards */
async function openReview(){
  const res = await api('/api/review/next', {});
  if(res.done){ add('sys','🃏 No cards due — come back after your next lesson.'); refreshDue(); return; }
  showCard(res);
  document.getElementById('reviewModal').classList.add('open');
}
function showCard(res){
  document.getElementById('cardsLeft').textContent = '(' + res.remaining + ' due)';
  document.getElementById('cardSkill').textContent = res.skill;
  document.getElementById('cardFront').textContent = res.front;
  const back = document.getElementById('cardBack');
  back.textContent = res.back; back.style.display = 'none';
  document.getElementById('showRow').style.display = 'flex';
  document.getElementById('gradeRow').style.display = 'none';
}
function showAnswer(){
  document.getElementById('cardBack').style.display = 'block';
  document.getElementById('showRow').style.display = 'none';
  document.getElementById('gradeRow').style.display = 'flex';
}
async function grade(q){
  await api('/api/review/grade', {quality:q});
  const res = await api('/api/review/next', {});
  if(res.done){ closeModal('reviewModal'); add('sys','🃏 All caught up — nice work.'); refreshDue(); return; }
  showCard(res);
}
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
/* browser voice — works on mobile, no python deps */
function speak(text){
  try{ const u = new SpeechSynthesisUtterance(text); u.rate = 1.05;
       speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
}
function toggleSpeak(){
  speakOn = !speakOn;
  document.getElementById('speakBtn').classList.toggle('on', speakOn);
  if(!speakOn) speechSynthesis.cancel();
}
function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ add('sys','⚠ voice input not supported in this browser — try Chrome/Safari.'); return; }
  const btn = document.getElementById('micBtn');
  if(rec){ rec.stop(); return; }
  rec = new SR(); rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = true;
  let finalText = input.value ? input.value + ' ' : '';
  rec.onresult = e => {
    let interim = '';
    for(let i = e.resultIndex; i < e.results.length; i++){
      if(e.results[i].isFinal) finalText += e.results[i][0].transcript + ' ';
      else interim += e.results[i][0].transcript;
    }
    input.value = (finalText + interim).trim(); autosize();
  };
  rec.onend = () => { rec = null; btn.classList.remove('listening'); };
  rec.onerror = () => { rec = null; btn.classList.remove('listening'); };
  btn.classList.add('listening'); rec.start();
}
/* composer */
function autosize(){ input.style.height='auto'; input.style.height = Math.min(input.scrollHeight,120)+'px'; }
input.addEventListener('input', autosize);
input.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey && window.innerWidth > 700){ e.preventDefault(); sendMsg(); }
});
async function refreshDue(){
  // due count comes back on /api/start; keep simple between sessions
}
/* boot */
(async () => {
  add('sys','Connecting to your mentor…');
  const res = await api('/api/start', {});
  handle(res);
  if(res.due > 0){
    document.getElementById('due').textContent = '🃏 ' + res.due + ' cards due';
    add('sys','You have ' + res.due + ' flashcards due — a quick review before we start locks in last session. Tap 🃏 Flashcards.');
  }
})();
</script>
</body>
</html>
